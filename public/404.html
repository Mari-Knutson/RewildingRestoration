<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Environmental Intelligence | RewildingRestoration</title>
  <script>
    const base = '/RewildingRestoration/';
    const route = window.location.pathname.startsWith(base)
      ? window.location.pathname.slice(base.length - 1)
      : '/';
    const query = window.location.search ? '&q=' + encodeURIComponent(window.location.search.slice(1)) : '';
    window.location.replace(base + '?route=' + encodeURIComponent(route + window.location.hash) + query);
  </script>
</head>
<body></body>
</html>
